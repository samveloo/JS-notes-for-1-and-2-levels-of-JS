<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fn(this)">Кнопка1</button>
    <button onclick="fn(this)">Кнопка2</button>
    <hr>
    <button>Кнопка3</button>
    <button>Кнопка4</button>

    <script>
        function fn(el){
            alert(el.innerHTML)
        }

        const btn3 = document.querySelector('button:nth-of-type(3)');
        btn3.onclick = function(){
            alert(this.innerHTML)
        }
    </script>
</body>
</html>
