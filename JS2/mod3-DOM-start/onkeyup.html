<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" onkeyup="fn(this)" value="Ехал Грека через javascript">
    <pre id="result"></pre>
    <script>
        function fn(el){
            let str = el.value;

            let obj = {
                'Сколько букв': str.length,
                'Сколько букв a': str.split('a').length - 1,
                'Присутствует ли javascript': str.includes('javascript'),
                'Верхний регистр': str.toUpperCase()
            }

            result.innerHTML = JSON.stringify(obj, null, ' ');
        }
    </script>
</body>
</html>
