<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <input onkeyup="fn(this)" type="text" />
        <pre id="result"></pre>

        <script>
            function fn(el) { 
                let str = el.value;

                let obj = {
                    "Сколько букв": str.length,
                    "Сколько букв а": str.split("а").length - 1,
                    "Присутствует ли слово 'javascript'": str.includes("javascript"),
                    "Верхний регистр": str.toUpperCase()
                }

                document.getElementById("result").innerHTML = JSON.stringify(obj, null, ' ');
            }
        </script>
    </body>
</html>
