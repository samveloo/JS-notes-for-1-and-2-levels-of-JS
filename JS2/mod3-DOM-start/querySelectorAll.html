<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .selected {
                padding: 4px;
                border: 1px dashed #000;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Заголовок</h1>
            <section>
                <h2>Заголовок</h2>
                <p><strong>Текст</strong></p>
                <p>Текст</p>
            </section>
            <section>
                <h2>Заголовок</h2>
                <p>Текст</p>
                <p>Текст <strong>тублвыыаы</strong> авыфоаов</p>
            </section>
        </div>

        <script>
            // let elements = document.querySelectorAll('.container');
            // let elements = document.querySelectorAll('section:nth-of-type(2) p');

            let elements = document.querySelectorAll('strong');
            
            for(let i = 0; i < elements.length; i++){
                elements[i].className = 'selected';
            }
            
            console.log(elements);

            let str = '';
            let coll = document.querySelectorAll('a')
            coll.forEach( a => {
                str += a.href + ', ';
            } )
            console.log(str.slice(0, -1));
        </script>
    </body>
</html>
