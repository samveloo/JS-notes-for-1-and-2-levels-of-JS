    <script>

        console.log(element);
        //console.log(element.innerHTML);

        //element.innerHTML = ':)'


        // const img = document.images[0];
        const img = document.querySelector('img');
        img.style.border = '10px solid #fff';
        img.style.boxShadow = '0 0 5px #444';
        img.style.borderRadius = '5px';

        img.onclick = function () {
            let i = 0, step = 10, tick = 40;
            let self = this;
            function a() {
                if (i < step) {
                    i++;
                    self.style.opacity = 1 - i / step;
                    setTimeout(a, tick);
                }
            }
            a()
        }
        
    </script>
