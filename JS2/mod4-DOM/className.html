<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .foo {
            background-color: bisque;
        }
    </style>
</head>
<body>
    <button onclick="change('p')">Нажми</button>

    <p class="first">Lorem ipsum dolor sit amet.</p>
    <p>Incidunt nesciunt illo iste necessitatibus!</p>
    <p>Sunt praesentium voluptate sapiente ipsam.</p>

    <script>
        const $ = selector => document.querySelectorAll(selector);

        const change = (selector) => {
            const els = $(selector);

            /* els.forEach(
                el => el.className = 'foo'
            ) */

            /* els.forEach(
                el => el.classList.add('foo')
            ) */

            els.forEach(
                el => el.classList.toggle('foo')
            )
        }
    </script>
</body>
</html>
