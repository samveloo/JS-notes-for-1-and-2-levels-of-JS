<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" id="addRow"">
        <input type="text">
        <input type="button" value="Добавить" onclick="add()">
    </form>

    <ul id="ul">
        <li>Lorem.</li>
        <li>Amet.</li>
        <li>Ea.</li>
    </ul>

    <script>
        function add(){
            const li = ul.querySelector('li');
            let clone = li.cloneNode(false);
            const text = addRow.elements[0].value;

            try {               
                if(!text.trim()) throw new Error("Empty value");
                
                addRow.elements[0].value = '';

                clone.innerHTML = text;
                ul.append(clone);

                addRow.elements[0].focus()
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>
</html>
