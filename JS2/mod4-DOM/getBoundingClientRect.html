    <script>
        const test = document.querySelector('#test'); 

        const {
            heigth,
            width,
            x,
            y
        } = test.getBoundingClientRect();

        console.log(heigth, width, x, y);

        let i = 0, step = 400, tick = 40;
        function a(){
            if (i < step){
                i++;
                test.style.left = x + i + 'px';
                test.style.top = y + i + 'px';
                test.style.transform = `rotate(${i}deg)`;
                setTimeout(a, 0);
            }
        }
