<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="Добавить форму" onclick="addForm()">

    <template id="form-search">
        <h2>Форма поиска</h2>
        <form action="https://google.com/search" class="form-search" target="_blank">
            <input type="text" name="q">
            <input type="submit">
        </form>
    </template>

    <script>
        function addForm(){
            if (document.querySelector('.form-search')) return;

            let template = document.querySelector('#form-search');
            let clone = template.content.cloneNode(true);
            document.body.append(clone)
        }
    </script>
</body>
</html>
